<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>English Ladder: приложение</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#F8FAFC;--surface:#fff;--soft:#f1f5f9;--ink:#0f172a;--muted:#64748b;--line:#e2e8f0;--brand:#2563EB;--brand-soft:#dbeafe;--on-brand:#fff;--cta:#F97316;--cta-ink:#1c0f02;--ok:#16a34a;--bad:#dc2626;--shadow:0 10px 30px rgba(15,23,42,.07);color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1322;--surface:#141c31;--soft:#1a2440;--ink:#e6e9f2;--muted:#94a0bb;--line:#27314e;--brand:#7ea6f5;--brand-soft:#1b2a52;--on-brand:#0d1322;--cta:#f0a35e;--ok:#7cc4a0;--bad:#f08a90;--shadow:0 12px 32px rgba(0,0,0,.4);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d1322;--surface:#141c31;--soft:#1a2440;--ink:#e6e9f2;--muted:#94a0bb;--line:#27314e;--brand:#7ea6f5;--brand-soft:#1b2a52;--on-brand:#0d1322;--cta:#f0a35e;--ok:#7cc4a0;--bad:#f08a90;--shadow:0 12px 32px rgba(0,0,0,.4);color-scheme:dark}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 120px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--surface);z-index:60}
h1,h2,h3,.brand,.hd{font-family:"Plus Jakarta Sans",system-ui,sans-serif;letter-spacing:-.02em}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:color-mix(in srgb,var(--surface) 90%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:10px 16px 8px}
.hwrap{max-width:1040px;margin:0 auto;display:flex;align-items:center;gap:10px}
.brand{text-decoration:none;display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px;background:none;border:0;color:var(--ink);cursor:pointer;padding:0}
.logo{display:inline-flex;width:34px;height:34px;border-radius:11px;align-items:center;justify-content:center;background:var(--brand);color:var(--on-brand);font-size:14px}
#xp{margin-left:auto;font-weight:600;font-size:13px;color:var(--brand);background:var(--brand-soft);padding:5px 12px;border-radius:999px}
#me{background:var(--brand-soft);border:1px solid var(--line);border-radius:50%;width:36px;height:36px;color:var(--brand);cursor:pointer;font-weight:700;font-size:13px}
#th{background:var(--surface);border:1px solid var(--line);border-radius:12px;width:36px;height:36px;color:var(--ink);cursor:pointer;font-size:16px}
nav{max-width:1040px;margin:8px auto 0;display:flex;flex-wrap:wrap;gap:6px}
nav button{font:600 13px Inter,sans-serif;color:var(--muted);background:transparent;border:1px solid transparent;border-radius:999px;padding:5px 12px;cursor:pointer}
nav button:hover{background:var(--brand-soft);color:var(--brand)}
main{max-width:860px;margin:22px auto 60px;padding:28px;background:var(--surface);border:1px solid var(--line);border-radius:1.5rem;box-shadow:var(--shadow)}
main.wide{max-width:1040px;background:transparent;border:0;box-shadow:none;padding:0 16px}
@media(max-width:820px){main{margin:14px 10px 40px;padding:20px 16px}main.wide{padding:0 12px;margin:14px auto 40px}}
h1{font-weight:800;font-size:clamp(28px,5vw,40px);line-height:1.12;margin:.1em 0 .5em}
h2{font-weight:800;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--brand);margin:1.8em 0 .6em}
h3{font-weight:700;font-size:20px;margin:1.4em 0 .4em}
p b,li b{color:var(--brand)}
small,.mut{color:var(--muted)}
.chip{display:inline-block;font-size:12px;font-weight:600;padding:3px 11px;border-radius:999px;background:var(--brand-soft);color:var(--brand)}
button{font:inherit}
main button{font-weight:600;font-size:15px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:.9rem;padding:8px 16px;margin:3px 6px 3px 0;cursor:pointer;transition:transform .15s,box-shadow .15s,background .15s}
main button:hover:not(:disabled){transform:translateY(-1px);box-shadow:var(--shadow);border-color:var(--brand)}
button:disabled{opacity:.45;cursor:default}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
main button.cta,button[data-a='next'],button[data-a='cs'],button[data-a='wq'],button[data-a='pimp'],button[data-a='cyes'],button[data-a='wchk'],button[data-a='chk']{background:var(--cta);border-color:var(--cta);color:var(--cta-ink)}
main button.pri{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
button[data-a='cflip']{font:800 30px "Plus Jakarta Sans",sans-serif;background:var(--soft);border:1px solid var(--line);border-radius:1.25rem;margin:6px 0 10px}
ol.map{list-style:none;padding:0;margin:0 0 6px}
ol.map li{position:relative;padding:8px 0 10px 44px;min-height:52px}
ol.map li::after{content:"";position:absolute;left:13px;top:0;bottom:0;width:4px;background:var(--line);border-radius:2px}
ol.map li:first-child::after{top:22px}ol.map li:last-child::after{bottom:calc(100% - 28px)}
ol.map li::before{content:"";position:absolute;z-index:1;left:6px;top:15px;width:20px;height:20px;border-radius:50%;background:var(--surface);border:4px solid var(--line)}
ol.map li.done::before{background:var(--ok);border-color:var(--ok)}
ol.map li.open::before{border-color:var(--brand)}
ol.map li.here::before{border-color:var(--cta);box-shadow:0 0 0 5px color-mix(in srgb,var(--cta) 25%,transparent)}
ol.map li.here button{border-color:var(--cta)}
ol.map li.lock button{border-style:dashed;color:var(--muted)}
ol.map h3{margin:1.2em 0 .2em}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.cards button{min-height:66px;margin:0}.cards .k{border-color:var(--ok);color:var(--ok)}
table{border-collapse:collapse;width:100%;margin:6px 0 14px}
td{padding:9px 10px;border-bottom:1px solid var(--line)}td:first-child{font-weight:700}
ul,ol:not(.map){padding-left:22px}li{margin-bottom:4px}
.ok{color:var(--ok);font-weight:700}.bad{color:var(--bad);font-weight:700}
input,textarea{font:inherit;padding:9px 12px;border:1px solid var(--line);border-radius:.8rem;background:var(--bg);color:var(--ink)}
progress{appearance:none;-webkit-appearance:none;width:100%;max-width:340px;height:8px;border:0;border-radius:6px;background:var(--line);vertical-align:middle;overflow:hidden}
progress::-webkit-progress-bar{background:var(--line);border-radius:6px}progress::-webkit-progress-value{background:var(--brand);border-radius:6px}progress::-moz-progress-bar{background:var(--brand);border-radius:6px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:1.25rem;box-shadow:var(--shadow)}
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:36px;align-items:center;padding:40px 0 28px}
@media(max-width:820px){.hero{grid-template-columns:1fr;padding:24px 0}}
.hero h1{font-size:clamp(32px,6vw,52px)}.lead{font-size:18px;color:var(--muted);max-width:34em}
.stats{padding:26px;display:grid;grid-template-columns:1fr 1fr;gap:14px;position:relative}
.stat{background:var(--soft);border-radius:1rem;padding:16px}.stat b{display:block;font:800 30px "Plus Jakarta Sans",sans-serif;color:var(--brand)}
.sec{padding:30px 0}.sec>h2{font-size:26px;letter-spacing:-.02em;text-transform:none;color:var(--ink);margin:0 0 .4em}
.how{display:grid;grid-template-columns:2fr 3fr;gap:22px}@media(max-width:820px){.how{grid-template-columns:1fr}}
.tab{display:block;width:100%;text-align:left;padding:14px 16px;margin:0 0 8px;border-radius:1rem;border:1px solid transparent;background:transparent;cursor:pointer;color:var(--ink)}
.tab.on{background:var(--surface);border-color:var(--line);box-shadow:var(--shadow)}
.num{display:inline-flex;width:28px;height:28px;border-radius:50%;align-items:center;justify-content:center;background:var(--brand-soft);color:var(--brand);font-weight:700;margin-right:8px}.tab.on .num{background:var(--brand);color:var(--on-brand)}
.win{overflow:hidden}.bar{display:flex;gap:6px;padding:12px 14px;border-bottom:1px solid var(--line)}.bar i{width:10px;height:10px;border-radius:50%;background:var(--line)}.pane{padding:22px;min-height:230px}
.pill{display:inline-block;border:1px solid var(--line);border-radius:.8rem;padding:6px 14px;margin:0 6px 6px 0;background:var(--soft)}
.fake{border:1px solid var(--line);border-radius:.8rem;padding:9px 12px;background:var(--bg);margin:6px 0}
.persp{perspective:1200px;max-width:420px;margin:0 auto}.flipc{position:relative;height:260px;transform-style:preserve-3d;transition:transform .6s cubic-bezier(.2,.8,.2,1)}.flipc.on{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px}.face.back{transform:rotateY(180deg)}
.wave{display:inline-flex;gap:3px;align-items:center;height:22px;vertical-align:middle;margin-left:8px}.wave i{width:3px;height:8px;border-radius:2px;background:var(--brand)}.wave.go i{animation:wv .8s ease-in-out infinite}.wave.go i:nth-child(2n){animation-delay:.15s}@keyframes wv{50%{height:20px}}
.lv{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}.lv .card{padding:18px}
@media (prefers-reduced-motion:reduce){.flipc{transition:none}.wave.go i{animation:none}}
</style>
</head>

<script>
var LV=[
{id:"A1",n:"Начальный",L:[

 e:[["c","Как по-английски «привет»?",["Hello","Goodbye","Please"],0],["c","My ___ is Tom.",["name","hello","yes"],0],["t","Переведите: спасибо","thank you|thanks"],["c","Ответ на «How are you?»",["I’m fine, thanks.","My name is Tom.","Goodbye."],0],["t","Допишите: Nice to ___ you.","meet"],["c","Как сказать «извините»?",["sorry","please","no"],0]]},

 th:"<p>Глагол <b>to be</b> («быть») нужен почти в каждом предложении.</p><ul><li>I <b>am</b> a student. (I’m)</li><li>You <b>are</b> a student. (You’re)</li><li>He / She / It <b>is</b> a student. (He’s)</li><li>We / They <b>are</b> students. (We’re)</li></ul><p>Отрицание: добавляем <b>not</b>: He <b>isn’t</b> a teacher.<br>Вопрос: меняем порядок слов: <b>Are</b> you a student?</p>",

 e:[["c","She ___ a teacher.",["am","is","are"],1],["c","We ___ students.",["is","are","am"],1],["t","I ___ a student. (am / is / are)","am"],["c","He ___ a student. (отрицание)",["isn’t","aren’t","amn’t"],0],["t","___ you a student? (Are / Is)","are"],["c","They ___ happy.",["is","are","am"],1]]},
{t:"Числа от 0 до 10 и возраст",

 v:[["zero","ноль"],["one","один"],["two","два"],["three","три"],["four","четыре"],["five","пять"],["six","шесть"],["seven","семь"],["eight","восемь"],["nine","девять"],["ten","десять"]],
 e:[["c","five это…",["4","5","6"],1],["t","Напишите словом: 3","three"],["t","Напишите словом: 7","seven"],["c","I ___ eight years old.",["am","is","are"],0],["c","ten это…",["8","9","10"],2],["t","Как по-английски «ноль»?","zero"]]},

"Семья","Дом и комната","Present Simple: утверждение","Еда и напитки","Время и дни недели"]},

{id:"C2",n:"Владение в совершенстве",L:["Стилистические приёмы","Редкие конструкции","Британский и американский английский","Тонкости пунктуации","Литературный язык","Юмор и каламбуры","Перевод и редактирование","Свободная речь"]}
];

A[0].th+="<h2>Время суток</h2><p>Утром: <b>Good morning</b>, днём: <b>Good afternoon</b>, вечером: <b>Good evening</b>, перед сном: <b>Good night</b>. Неформально: <b>Hi</b>, <b>Bye</b>, <b>See you</b>.</p><h2>Вежливость</h2><p><b>Please</b> добавляют к просьбе. На <b>Thank you</b> отвечают <b>You’re welcome</b> («не за что»).</p><h2>Мини-диалог</h2><p>Tom: Hello! My name is Tom.<br>Anna: Hi, Tom! I’m Anna. Nice to meet you.<br>Tom: Nice to meet you, too.</p>";
A[0].v.push(["good morning","доброе утро"],["good night","спокойной ночи"],["you’re welcome","не за что"],["see you","увидимся"]);
A[0].e.push(["c","Что сказать утром?",["Good morning","Good night","Goodbye"],0],["t","Ответ на «Thank you»: You’re ___","welcome"]);
A[0].p={t:"Практика: напишите знакомство",e:[["t","Напишите: «Меня зовут Анна» (My name is …)","my name is anna"],["t","Напишите: «Приятно познакомиться»","nice to meet you"],["t","Напишите: «Доброе утро»","good morning"],["t","Напишите: «Увидимся»","see you"]]};
A[1].s="am / is / are, краткие формы, отрицание, вопросы, краткие ответы";
A[1].th+="<h2>Краткие ответы</h2><p>Are you a student? — Yes, I am. / No, I’m not.<br>Is she happy? — Yes, she is. / No, she isn’t.</p><h2>Частая ошибка</h2><p>В английском нельзя пропускать to be: не «I student», а <b>I am a student</b>.</p>";

A[2].e.push(["c","How old is he? — He ___ six.",["is","are","am"],0],["t","Напишите словом: 10","ten"]);
A[2].p={t:"Практика: числа и возраст",e:[["t","Напишите: «Мне восемь лет»","i am eight|i’m eight|i am eight years old|i’m eight years old"],["t","Напишите: «Сколько тебе лет?»","how old are you"],["t","Прочитайте 5-0-7: five, ___, seven","zero"],["t","Напишите: «Ему девять»","he is nine|he’s nine"]]};

A[3].th+="<h2>Важен звук, а не буква</h2><p><b>an umbrella</b> (гласный звук), но <b>a university</b> (первый звук «ю»).</p><h2>Множественное число</h2><p>Перед словом во множественном числе a / an не ставим: <i>a dog</i> → <i>dogs</i>.</p>";

mk(4,"Семья","mother, father, brother, sister; my / your / his / her",

mkA(1,3,"Сравнение прилагательных","bigger, more expensive, the best; than; as … as",
"<p>Короткие прилагательные: + <b>-er</b> (big → bigger, cheap → cheaper), превосходная степень: <b>the</b> + <b>-est</b> (the biggest). Длинные: <b>more</b> / <b>the most</b>: more expensive, the most interesting.</p><p>Неправильные: good → <b>better</b> → <b>the best</b>; bad → <b>worse</b> → <b>the worst</b>.</p><p>Сравниваем через <b>than</b>: My car is faster than yours. Равенство: <b>as … as</b>: He is as tall as me.</p>",
"than:чем,better:лучше,worse:хуже,best:лучший,worst:худший,fast:быстрый,slow:медленный,interesting:интересный",
[C("This bag is ___ than that one. (cheap)","cheaper|more cheap|cheapest",0),C("This is ___ book. (interesting, самая)","the most interesting|the interestingest|more interesting",0),C("good → ___","gooder|better|more good",1),C("She is taller ___ me.","than|then|as",0),T("big → ___ (сравнительная)","bigger"),T("Допишите: He is as tall ___ me.","as")],

mkA(1,6,"be going to","планы и намерения, предсказания по признакам",
"<p><b>be going to</b> используем для планов: I <b>am going to</b> travel next month. She <b>is going to</b> study. Форма: am / is / are + going to + глагол.</p><p>Отрицание: He <b>isn’t going to</b> come. Вопрос: <b>Are</b> you <b>going to</b> buy it?</p><p>Ещё так говорят, когда видят признаки: Look at the clouds! It <b>is going to</b> rain.</p>",
"plan:план,next week:на следующей неделе,soon:скоро,future:будущее,tonight:сегодня вечером,maybe:может быть,probably:вероятно,decide:решать",
[C("I ___ going to visit my aunt.","am|is|are",0),C("She ___ going to study.","am|is|are",1),C("We aren’t ___ to go.","go|going|goes",1),C("___ you going to buy it?","Are|Do|Is",0),T("Look at the sky! It’s going ___ rain.","to")],

mkA(1,7,"Здоровье","симптомы, визит к врачу; should / shouldn’t",
"<p>Жалобы: <b>I have a headache / a cold / a fever.</b> <b>My throat hurts.</b> <b>I feel sick.</b></p><p>Совет: <b>should</b> + глагол без to: You <b>should</b> rest. You <b>shouldn’t</b> work today. Вопрос: <b>Should</b> I call a doctor?</p><p>У врача: <b>What’s the matter?</b> (Что случилось?) <b>Take this medicine twice a day.</b> (Принимайте лекарство два раза в день.)</p>",

mkA(1,8,"Past Continuous","was / were + -ing, when и while",
"<p>Процесс в прошлом: I <b>was reading</b> at 8 o’clock. They <b>were playing</b> football. Форма: <b>was / were + глагол-ing</b>.</p><p>Отрицание: She <b>wasn’t</b> sleeping. Вопрос: <b>Were</b> you working?</p><p>Часто вместе с Past Simple: I <b>was walking</b> when it <b>started</b> to rain. <b>While</b> стоит перед длящимся действием, <b>when</b> перед коротким событием.</p>",
"while:пока,suddenly:вдруг,at that moment:в тот момент,during:во время,meanwhile:тем временем,again:снова",
[C("I ___ at 8 o’clock.","was reading|were reading|read",0),C("They ___ football.","was playing|were playing|played",1),C("She ___ sleeping. (не спала)","wasn’t|weren’t|didn’t",0),C("I was walking ___ it started to rain.","when|while|during",0),T("___ you working? (Was / Were)","were")],

mkA(1,9,"Present Perfect: введение","have / has + третья форма, опыт, ever / never / already / yet",
"<p>Present Perfect связывает прошлое с настоящим: I <b>have been</b> to Paris (опыт). She <b>has lost</b> her key (результат важен сейчас). Форма: <b>have / has + третья форма глагола</b>.</p><p>Правильные глаголы: worked, visited. Неправильные: been, seen, done, eaten, gone, written.</p><p>Вопрос: <b>Have</b> you ever been to London? Отрицание: I <b>haven’t seen</b> it yet. Слова: <b>ever, never, already, yet, just</b>.</p>",
"ever:когда-либо,never:никогда,already:уже,yet:ещё,just:только что,since:с,for:в течение,gone:ушёл",
[C("I ___ been to Paris.","have|has|am",0),C("She ___ lost her key.","have|has|is",1),C("___ you ever seen it?","Have|Has|Did",0),C("I haven’t seen it ___.","yet|ever|already",0),T("write → written; eat → ___","eaten")],
"Практика: ваш опыт",[T("Напишите: «Я был в Лондоне»","i have been to london|i’ve been to london"),T("Напишите: «Она уже поела»","she has already eaten|she’s already eaten"),T("Напишите вопрос: «Ты когда-нибудь видел это?»","have you ever seen it|have you ever seen this")]);
mkA(1,10,"some / any / a lot of","количество в утверждениях и вопросах, a few / a little",
"<p><b>some</b> в утверждениях: I have <b>some</b> apples. <b>any</b> в вопросах и отрицаниях: Do you have <b>any</b> milk? I don’t have <b>any</b> money.</p><p>В предложениях и просьбах some остаётся: Would you like <b>some</b> tea?</p><p><b>a lot of</b> (много) подходит и для счётных, и для неисчисляемых. <b>a few</b> (несколько) со счётными, <b>a little</b> (немного) с неисчисляемыми.</p>",
"some:несколько,any:какой-нибудь,a lot of:много,a few:немного (о счётных),a little:немного (о неисчисляемых),enough:достаточно,plenty:в изобилии,none:ни одного",
[C("I have ___ apples.","some|any|a",0),C("Do you have ___ milk?","some|any|an",1),C("I don’t have ___ money.","some|any|a lot",1),C("Would you like ___ tea?","some|any|many",0),T("a few — со счётными, a ___ — с неисчисляемыми","little")],

"<p><b>Zero Conditional</b> описывает факты: If you <b>heat</b> ice, it <b>melts</b>. (If + Present Simple, Present Simple)</p><p><b>First Conditional</b> описывает реальные ситуации в будущем: If it <b>rains</b>, I <b>will stay</b> home. (If + Present Simple, will + глагол)</p><p>После if нельзя ставить will: не «If it will rain». Отрицание: <b>won’t</b> (will not).</p>",

mkA(2,1,"Present Perfect и Past Simple","когда использовать каждое время",
"<p><b>Past Simple</b>: время указано или понятно: I <b>saw</b> that film <b>last week</b>. <b>Present Perfect</b>: время не важно, важен опыт или результат: I <b>have seen</b> that film.</p><p>С конкретным временем (yesterday, in 2019, ago, last year) всегда Past Simple: не «I have seen it yesterday».</p><p>С ever, never, already, yet, just обычно Present Perfect. Вопрос о времени: <b>When did</b> you see it? (Past Simple)</p>",

"<p>Future Continuous показывает действие, которое будет в процессе в определённый момент будущего: This time tomorrow I <b>will be flying</b> to Rome. Форма: <b>will be + глагол-ing</b>.</p><p>Вопрос: <b>Will</b> you <b>be using</b> the car tonight? Отрицание: <b>won’t be</b> working. Так же вежливо спрашивают о планах: Will you be coming to the party?</p><p>Маркеры: at 5 o’clock tomorrow, this time next week.</p>",
"fly:лететь,attend:присутствовать,conference:конференция,land:приземляться,board:садиться на борт,airline:авиакомпания,abroad:за границей,overseas:за океаном",
[C("This time tomorrow I ___ to Rome.","will be flying|will fly|am fly",0),C("At 5 o’clock she ___ working.","will be|will|is be",0),C("___ you be using the car tonight?","Will|Do|Are",0),C("We ___ be sleeping at midnight. (не будем)","won’t|don’t|aren’t",0),T("At 8 tomorrow I will be ___. (sleep)","sleeping")],

mkA(3,1,"Future Perfect","will have + третья форма, результат к моменту в будущем",
"<p>Future Perfect показывает действие, которое будет завершено <b>к определённому моменту</b> в будущем: By 2030 I <b>will have finished</b> my degree. Форма: <b>will have + третья форма</b>.</p><p>Маркеры: <b>by</b> (к), <b>by the time</b>, <b>by next year</b>. Отрицание: <b>won’t have</b> finished. Вопрос: <b>Will</b> you <b>have</b> finished by Friday?</p><p>Сравните: Future Continuous описывает процесс в момент, Future Perfect описывает результат к моменту.</p>",

[C("By 2030 I ___ my degree.","will have finished|will finish|have finished",0),C("She ___ left by six.","will have|will|has",0),C("By next year we ___ here for ten years.","will have lived|will live|are living",0),C("___ you have finished by Friday?","Will|Do|Are",0),T("I won’t have ___ by then. (finish)","finished")],

mkA(3,2,"Past Perfect Continuous","had been + -ing, процесс до момента в прошлом",
"<p>Past Perfect Continuous показывает процесс, который шёл до какого-то момента в прошлом: When she arrived, I <b>had been waiting</b> for an hour. Форма: <b>had been + глагол-ing</b>.</p><p>Часто объясняет причину: His eyes were red because he <b>had been crying</b>. Отрицание: <b>hadn’t been</b> sleeping. Вопрос: How long <b>had</b> you <b>been waiting</b>?</p><p>Сравните: <b>had waited</b> — факт, <b>had been waiting</b> — длительность процесса.</p>",

[C("When she arrived, I ___ for an hour.","had been waiting|have been waiting|was wait",0),C("His eyes were red. He ___.","had been crying|has been crying|cried",0),C("How long ___ you been waiting?","had|have|did",0),C("They ___ sleeping. (не спали)","hadn’t been|haven’t been|weren’t be",0),T("She had been ___ for hours. (work)","working")],

mkA(3,3,"Third Conditional","If + Past Perfect, would have + третья форма",
"<p>Third Conditional описывает нереальное прошлое: что было бы, если бы… If I <b>had studied</b>, I <b>would have passed</b> the exam. (Но я не учился и не сдал.)</p><p>Форма: <b>If + Past Perfect, would have + третья форма</b>. Отрицание: <b>wouldn’t have</b>. Вместо would можно could / might: I <b>could have</b> helped.</p><p>Часто выражает сожаление: If only I <b>had known</b>! I wish I <b>had gone</b>.</p>",
"regret:сожалеть,pass:сдать экзамен,fail:провалить,if only:если бы только,I wish:жаль что,lucky:удачливый,unlucky:неудачливый,chance:шанс",
[C("If I ___ studied, I would have passed.","had|have|would have",0),C("If she had known, she ___ helped.","would have|would|had",0),C("If we ___ earlier, we wouldn’t have missed it.","had left|left|would leave",0),C("If only I ___ known!","had|have|would",0),T("He would ___ come if you had asked. (have / has)","have")],
"Практика: если бы тогда…",[T("Напишите: «Если бы я учился, я бы сдал»","if i had studied i would have passed|if i had studied i’d have passed"),T("Напишите: «Если бы она знала, она бы помогла»","if she had known she would have helped|if she had known she’d have helped"),T("Напишите: «Жаль, что я не пошёл» (I wish …)","i wish i had gone")]);
mkA(3,4,"Смешанные условные","прошлое влияет на настоящее и наоборот",
"<p>Смешанные условные соединяют разное время.</p><p><b>Прошлое → настоящее</b>: If I <b>had taken</b> the job, I <b>would be</b> rich now. (If + Past Perfect, would + глагол)</p><p><b>Настоящее → прошлое</b>: If I <b>were</b> more careful, I <b>wouldn’t have broken</b> it. (If + Past Simple, would have + третья форма)</p><p>Подсказки: now, today (настоящее) и yesterday, last year (прошлое).</p>",
"careless:небрежный,accept:принимать,turn down:отклонять,job offer:предложение работы,hindsight:взгляд из будущего,otherwise:иначе,instead:вместо этого,outcome:исход",
[C("If I had taken the job, I ___ rich now.","would be|would have been|will be",0),C("If I were more careful, I ___ broken it.","wouldn’t have|wouldn’t|won’t have",0),C("If she ___ harder, she would have a better job now.","had worked|worked|works",0),C("Какая форма: прошлое → настоящее?","had done … would be|did … would have done|do … will be",0),T("If I were rich, I wouldn’t have ___ the job. (take)","taken")],
"Практика: прошлое и настоящее",[T("Напишите: «Если бы я принял работу, я бы сейчас был богат»","if i had taken the job i would be rich now|if i had taken the job i’d be rich now"),T("Напишите: «Если бы я был осторожнее, я бы этого не сломал»","if i were more careful i wouldn’t have broken it|if i were more careful i would not have broken it"),T("Напишите: «Если бы она училась, у неё была бы лучшая работа»","if she had studied she would have a better job now|if she had studied she’d have a better job now|if she had studied she would have a better job|if she had studied she’d have a better job")]);
mkA(3,5,"Пассив во всех временах","is done, was done, has been done, is being done, will be done",
"<p>Схема пассива: <b>to be (в нужном времени) + третья форма</b>.</p><p>Present Simple: is done. Past Simple: was done. Present Continuous: <b>is being</b> done. Past Continuous: <b>was being</b> done. Present Perfect: <b>has been</b> done. Past Perfect: <b>had been</b> done. Future: <b>will be</b> done. Модальные: <b>can be</b> done, <b>must be</b> done.</p><p>Примеры: The bridge <b>is being built</b> now. The report <b>had been written</b> before the meeting.</p>",
"currently:на данный момент,under construction:строится,renovate:ремонтировать (здание),approve:одобрять,publish:публиковать,examine:исследовать,involve:вовлекать,authority:власть",
[C("The bridge ___ now.","is being built|is built|has built",0),C("The report ___ before the meeting.","had been written|was been written|wrote",0),C("The room ___ yesterday.","was cleaned|is cleaned|cleaned",0),C("The letter ___ already.","has been sent|have been sent|is sending",0),T("It must be ___. (do)","done")],

mkA(3,6,"Каузатив: have something done","когда действие делает кто-то другой",
"<p>Каузатив используют, когда действие делает для нас кто-то другой: I <b>had</b> my car <b>repaired</b>. (Мне починили машину.) She <b>is having</b> her hair <b>cut</b>.</p><p>Форма: <b>have + что-то + третья форма</b>. В разговоре часто используют <b>get</b>: I got my phone fixed.</p><p>Сравните: I cleaned my house (сам) и I <b>had</b> my house <b>cleaned</b> (мне убрали). Вопрос: Where do you <b>have</b> your hair <b>cut</b>?</p>",
"haircut:стрижка,dentist:стоматолог,mechanic:механик,tailor:портной,service:обслуживание,fix:чинить,install:устанавливать,decorate:украшать",
[C("I ___ my car repaired yesterday.","had|did|was",0),C("She is having her hair ___.","cut|cutting|to cut",0),C("We ___ the house painted last month.","had|have|were",0),C("Where do you ___ your hair cut?","have|has|do",0),T("I got my phone ___. (fix)","fixed")],
"Практика: кто-то сделал за вас",[T("Напишите: «Мне починили машину»","i had my car repaired|i had my car fixed|i got my car repaired|i got my car fixed"),T("Напишите: «Её сейчас стригут»","she is having her hair cut|she’s having her hair cut"),T("Напишите: «Нам покрасили дом»","we had the house painted|we had our house painted|we got the house painted|we got our house painted")]);

mkA(3,7,"Модальные в прошлом","must have done, might have done, should have done",
"<p>Модальные глаголы + have + третья форма говорят о прошлом.</p><p><b>must have done</b>: наверняка было (вывод). He isn’t here. He <b>must have forgotten</b>.<br><b>might / may / could have done</b>: возможно было. She <b>might have missed</b> the bus.<br><b>can’t have done</b>: не могло быть. He <b>can’t have seen</b> us.<br><b>should have done</b>: надо было, но не сделал (упрёк). You <b>should have called</b>. <b>shouldn’t have done</b>: не надо было. I <b>shouldn’t have said</b> that.</p>",
"certainly:наверняка,perhaps:возможно,blame:винить,criticise:критиковать,guess:догадываться,deduce:делать вывод,assumption:предположение,reproach:упрёк",
[C("He isn’t here. He ___ forgotten.","must have|should|can’t",0),C("She ___ missed the bus. (возможно)","might have|must|should",0),C("You ___ called me. (надо было)","should have|must|can’t",0),C("He ___ seen us. (не мог)","can’t have|mustn’t|shouldn’t",0),T("I shouldn’t have ___ that. (say)","said")],

mkA(3,8,"Косвенная речь: вопросы и приказы","He asked me to…; She wondered if…",
"<p>Общие вопросы передаются через <b>if / whether</b>: «Are you ready?» → She asked <b>if</b> I was ready.</p><p>Специальные вопросы сохраняют вопросительное слово, но порядок слов прямой: «Where do you live?» → He asked <b>where I lived</b>.</p><p>Приказы и просьбы передаются через <b>to + глагол</b>: «Close the door.» → She told me <b>to close</b> the door. Запрет: «Don’t go.» → He told me <b>not to go</b>.</p><p>Глаголы: ask, tell, advise, warn, wonder.</p>",
"wonder:интересоваться,advise:советовать,warn:предупреждать,request:просьба,command:приказ,insist:настаивать,whether:ли,remind:напоминать",
[C("«Are you ready?» → She asked ___ I was ready.","if|that|what",0),C("«Where do you live?» → He asked where I ___.","lived|live|did live",0),C("«Close the door.» → She told me ___ the door.","to close|close|closing",0),C("«Don’t go.» → He told me ___ go.","not to|don’t|to not",0),T("«Is it open?» → She asked ___ it was open. (if / that)","if")],
"Практика: передайте вопросы и просьбы",[T("Напишите: «Она спросила, где я живу» (She asked …)","she asked where i lived"),T("Напишите: «Он сказал мне закрыть дверь»","he told me to close the door"),T("Напишите: «Она велела мне не ходить»","she told me not to go")]);
mkA(3,9,"Относительные придаточные: расширенно","определительные и описательные, предлоги, which о всей фразе",
"<p><b>Определительные</b> (без запятых) нужны, чтобы понять, о ком речь: The man <b>who lives next door</b> is a doctor.</p><p><b>Описательные</b> (с запятыми) добавляют информацию: My brother, <b>who lives in Rome</b>, is a doctor. В них нельзя использовать that и нельзя опускать who / which.</p><p>С предлогом: The girl <b>to whom</b> I spoke (формально) / The girl <b>who</b> I spoke <b>to</b> (разговорно). Which может относиться ко всей фразе: He passed the exam, <b>which</b> surprised everyone.</p>",
"defining:определительный,non-defining:описательный,clause:придаточное,comma:запятая,sentence:предложение,pronoun:местоимение,formal:формальный,informal:неформальный",
[C("My brother, ___ lives in Rome, is a doctor.","who|that|which",0),C("He passed, ___ surprised everyone.","which|that|what",0),C("The girl to ___ I spoke is a nurse.","whom|who|whose",0),C("Запятые нужны в … придаточном.","описательном|определительном|любом",0),T("The book, ___ I bought, was good. (which / that)","which")],

mkA(3,10,"Идиомы","устойчивые выражения: break the ice, a piece of cake",
"<p>Идиомы — устойчивые выражения, значение которых не складывается из слов. <b>break the ice</b>: растопить лёд; <b>a piece of cake</b>: проще простого; <b>under the weather</b>: нездоровится; <b>once in a blue moon</b>: крайне редко; <b>hit the sack</b>: лечь спать; <b>cost an arm and a leg</b>: стоить целое состояние; <b>spill the beans</b>: проболтаться.</p><p>Примеры: The exam was <b>a piece of cake</b>. I’m feeling <b>under the weather</b> today.</p><p>Дословно идиомы не переводят: ищите русский эквивалент по смыслу.</p>",
"let the cat out of the bag:выдать секрет,the ball is in your court:ход за вами,add insult to injury:усугублять,burn the midnight oil:работать допоздна,throw in the towel:сдаться,beat around the bush:ходить вокруг да около,cut corners:срезать углы,on the ball:быть начеку",
[C("The exam was a piece of ___.","cake|bread|pie",0),C("I’m feeling under the ___.","weather|rain|cloud",0),C("spill the beans значит…","проболтаться|пролить еду|готовить",0),C("once in a blue ___","moon|sky|night",0),T("hit the ___ (лечь спать)","sack")],
"Практика: идиомы в речи",[T("Напишите: «Экзамен был проще простого»","the exam was a piece of cake"),T("Напишите: «Мне нездоровится»","i’m feeling under the weather|i am feeling under the weather|i feel under the weather"),T("Напишите: «Я иду спать» (hit the sack)","i’m going to hit the sack|i am going to hit the sack")]);
mkA(3,11,"Эссе и аргументация","структура, связки, мнение и контраргумент",
"<p>Структура эссе: <b>введение</b> (тема и ваша позиция), <b>основная часть</b> (2–3 абзаца, в каждом одна мысль и пример), <b>заключение</b> (вывод).</p><p>Связки: <b>Firstly, … Moreover, … In addition, …</b> (добавление); <b>However, … On the other hand, …</b> (контраст); <b>Therefore, … As a result, …</b> (следствие); <b>In conclusion, …</b> (вывод).</p><p>Мнение: <b>In my opinion, … I strongly believe that … It could be argued that …</b> Контраргумент: <b>Some people claim that …, but …</b></p>",

mkA(3,12,"Деловое письмо","формальный регистр, структура, вежливые формулы",
"<p>Формальное письмо: обращение <b>Dear Mr Brown,</b> (если имя неизвестно, <b>Dear Sir or Madam,</b>); цель: <b>I am writing to enquire about…</b>; просьба: <b>Could you please send me…</b>; завершение: <b>I look forward to hearing from you.</b> и <b>Yours sincerely,</b> (если знаете имя) или <b>Yours faithfully,</b> (если не знаете).</p><p>Избегайте сокращений (I’m, don’t) и разговорных слов. Тон вежливый: <b>I would be grateful if you could…</b></p>",

mkA(4,0,"Инверсия","Never have I seen…; Hardly had I… when…; Had I known…",
"<p>Для усиления после отрицательных и ограничительных слов в начале предложения порядок слов меняется, как в вопросе: <b>Never have I seen</b> such a view. (Я никогда не видел такого вида.)</p><p>Частые слова: <b>never, rarely, seldom, hardly … when, no sooner … than, not only … but also, only after</b>. <b>Hardly had</b> I arrived <b>when</b> it started to rain. <b>No sooner had</b> she left <b>than</b> he called. <b>Not only did</b> he lose his job, but he also lost his home.</p><p>Условная инверсия: <b>Had I known</b>, I would have helped (= If I had known). <b>Should you need</b> help, call me.</p>",
"hardly:едва,scarcely:едва ли,seldom:редко (в инверсии),no sooner:не успел,not only:не только,whatsoever:вовсе,under no circumstances:ни при каких обстоятельствах,on no account:ни в коем случае",
[C("Never ___ such a view.","have I seen|I have seen|I saw",0),C("Hardly ___ arrived when it rained.","had I|I had|did I",0),C("No sooner had she left ___ he called.","than|when|that",0),C("Not only ___ he lose his job, but also his home.","did|does|has",0),T("___ I known, I would have helped. (Had / If)","had")],

mkA(4,1,"Cleft sentences","It was … that …; What I need is …",
"<p>Расщеплённые предложения выделяют главное в предложении.</p><p><b>It-cleft</b>: <b>It was</b> Tom <b>who</b> broke the window. (Именно Том разбил окно.) <b>It is</b> money <b>that</b> matters.</p><p><b>Wh-cleft</b>: <b>What I need is</b> a holiday. <b>What he did was</b> (to) call the police. <b>The thing that</b> annoys me <b>is</b> noise.</p><p>Такие конструкции делают речь выразительнее и часто встречаются в аргументации.</p>",
"annoy:раздражать,matter:иметь значение,emphasise:подчёркивать,highlight:выделять,precisely:именно,exactly:точно,rather:скорее,indeed:действительно",
[C("___ was Tom who broke the window.","It|What|There",0),C("___ I need is a holiday.","What|It|That",0),C("It is money ___ matters.","that|what|who",0),C("The thing that annoys me ___ noise.","is|are|was is",0),T("It was Anna ___ called. (who / what)","who")],

mkA(4,2,"Subjunctive","suggest that he go; it is essential that she arrive",
"<p>Сослагательное наклонение используют в формальной речи после слов со значением предложения, требования, важности: <b>suggest, recommend, insist, demand, propose; it is essential / vital / important that</b>.</p><p>Форма: <b>that + подлежащее + базовая форма глагола</b> (без -s и без will): I suggest that he <b>go</b> home. It is essential that she <b>arrive</b> on time. The manager insisted that everyone <b>be</b> present.</p><p>Отрицание: <b>not</b> + глагол: I suggest that he <b>not</b> go. Также: <b>If I were</b> you; <b>I wish I were</b>; <b>as if he were</b>.</p>",
"demand:требовать,recommend:рекомендовать,propose:предлагать (официально),essential:жизненно необходимый,vital:жизненно важный,require:нуждаться,mandatory:предписанный,present:присутствующий",
[C("I suggest that he ___ home.","go|goes|will go",0),C("It is essential that she ___ on time.","arrive|arrives|arrived",0),C("The manager insisted that everyone ___ present.","be|is|was",0),C("I suggest that he ___ go. (не)","not|doesn’t|won’t",0),T("I wish I ___ taller. (were / was)","were")],
"Практика: формальные предложения",[T("Напишите: «Я предлагаю, чтобы он пошёл домой» (I suggest that …)","i suggest that he go home"),T("Напишите: «Важно, чтобы она пришла вовремя» (It is essential …)","it is essential that she arrive on time"),T("Напишите: «Если бы я был тобой» (If I …)","if i were you")]);
mkA(4,3,"Причастные обороты","Walking home…; Having finished…; Written in 1990…",
"<p>Причастные обороты сокращают придаточные и делают речь компактнее.</p><p><b>-ing</b> (одновременное действие или причина): <b>Walking</b> home, I met Tom. (= While I was walking…) <b>Feeling</b> tired, she went to bed.</p><p><b>Having + третья форма</b> (действие раньше): <b>Having finished</b> the work, he left. (= After he had finished…)</p><p><b>Третья форма (пассив)</b>: <b>Written</b> in 1990, the book is still popular. <b>Surprised</b> by the news, she sat down.</p><p>Подлежащее оборота должно совпадать с подлежащим главной части. Неверно: «Walking home, the rain started.»</p>",
"participle:причастие,simultaneous:одновременный,previous:предыдущий,compact:компактный,reduce:сокращать,main clause:главная часть,shorten:укорачивать,consistent:согласованный",

"Практика: сократите предложение",[T("Напишите: «Идя домой, я встретил Тома» (… home, I met Tom)","walking home i met tom"),T("Напишите: «Закончив работу, он ушёл» (Having …)","having finished the work he left|having finished his work he left"),T("Напишите: «Написанная в 1990 году, книга популярна» (Written …)","written in 1990 the book is still popular|written in 1990 the book is popular")]);
mkA(4,4,"Артикли с абстрактными понятиями","life, the life of…; the rich, by car, in prison",
"<p>Абстрактные и неисчисляемые существительные в общем смысле употребляются <b>без артикля</b>: <b>Life</b> is short. <b>Love</b> is important.</p><p><b>the</b> появляется, когда понятие уточняется: <b>The life</b> of a soldier is hard. <b>The love</b> I feel for her is strong.</p><p>Особые случаи: <b>the</b> с уникальными объектами (the sun), с превосходной степенью (the best), с группами (the rich — богатые, the elderly — пожилые). Без артикля: <b>by car</b>, <b>at home</b>, <b>in prison</b> (как место отбывания), но <b>the prison</b> (здание).</p>",
"abstract:абстрактный,concept:понятие,general:общий,specific:конкретный,uncountable:неисчисляемый,elderly:пожилой,unique:уникальный,institution:учреждение",

"<p><b>needn’t have done</b>: зря сделал (можно было не делать): You <b>needn’t have bought</b> it. <b>didn’t need to do</b>: не нужно было, и не сделал.</p><p><b>might as well</b>: можно и …, раз уж так: We <b>might as well</b> go home. <b>be bound to</b>: наверняка произойдёт: He <b>is bound to</b> win. <b>be supposed to</b>: предполагается: You <b>are supposed to</b> be here at nine.</p><p><b>would rather</b>: предпочёл бы: I’d <b>rather</b> stay. <b>had better</b>: лучше бы: You <b>had better</b> hurry. <b>may well</b>: вполне возможно: It <b>may well</b> rain.</p>",

mkA(4,7,"Дискурсивные маркеры","nevertheless, whereas, despite, owing to",

"nevertheless:тем не менее,whereas:тогда как,despite:несмотря на,consequently:следовательно,furthermore:кроме того,owing to:из-за,in other words:другими словами,all things considered:всё взвесив",
[C("___ the rain, we went out.","Despite|Although|However",0),C("___ it was raining, we went out.","Although|Despite|In spite",0),C("He is rich, ___ his brother is poor.","whereas|despite|owing to",0),C("The flight was cancelled ___ the storm.","owing to|although|whereas",0),T("It was hard. ___, we finished. (Nevertheless / Because)","nevertheless")],

mkA(4,8,"Академический стиль","нейтральность, безличный пассив, номинализация",
"<p>Академический стиль нейтрален, точен и безличен.</p><p><b>Без сокращений и разговорных слов</b>: do not, cannot; a lot of → a great deal of; get → obtain / receive; show → demonstrate.</p><p><b>Пассив и безличные формы</b>: It <b>is believed</b> that… It <b>can be seen</b> that… The results <b>were analysed</b>.</p><p><b>Номинализация</b> (глагол → существительное): decide → <b>decision</b>; improve → <b>improvement</b>; develop → <b>development</b>. Текст становится компактнее и формальнее.</p>",
"demonstrate:демонстрировать,obtain:получать,analyse:анализировать,nominalisation:номинализация,impersonal:безличный,objective:объективный,precise:чёткий,formal register:формальный стиль",

"<p>Коллокации — слова, которые «дружат» друг с другом. Нельзя сказать «do a decision», правильно: <b>make a decision</b>.</p><p><b>make</b>: make progress, make an effort, make a point, make sense. <b>do</b>: do research, do harm, do business, do your best. <b>take</b>: take place, take advantage of, take into account. <b>draw</b>: draw a conclusion, draw attention to.</p><p>Сильные сочетания: <b>heavy rain</b> (не strong), <b>strong coffee</b>, <b>deeply concerned</b>, <b>highly unlikely</b>, <b>bitterly disappointed</b>.</p>",

mkA(4,11,"Осторожные утверждения (hedging)","it seems that, tends to, arguably",

mkA(5,0,"Стилистические приёмы","metaphor, simile, hyperbole, understatement, irony",
"<p>Стилистические приёмы делают речь выразительной.</p><p><b>Metaphor</b>: прямое сравнение без like: Time is a thief. <b>Simile</b>: сравнение с like / as: as brave as a lion. <b>Hyperbole</b>: преувеличение: I’ve told you a million times. <b>Understatement</b>: преуменьшение: It’s a bit chilly (в мороз −20). <b>Irony</b>: смысл противоположен сказанному: «Lovely weather!» (в ливень). <b>Personification</b>: оживление предмета: The wind whispered. <b>Alliteration</b>: повтор звуков: safe and sound.</p>",
"metaphor:метафора,simile:сравнение,hyperbole:гипербола,understatement:преуменьшение,irony:ирония,personification:олицетворение,alliteration:аллитерация,sarcasm:сарказм",

mkA(5,3,"Тонкости пунктуации","semicolon, colon, dash, ellipsis, Oxford comma, its / it’s",
"<p><b>Semicolon ( ; )</b> соединяет близкие по смыслу независимые предложения: I was tired; I went to bed. <b>Colon ( : )</b> вводит пояснение или список: You need three things: time, money, patience. <b>Dash ( — )</b> добавляет акцент: He had one fear — failure. <b>Ellipsis ( … )</b> передаёт недосказанность. <b>Oxford comma</b>: запятая перед and в списке: apples, pears, and plums.</p><p>Апостроф: <b>its</b> (притяжательное) и <b>it’s</b> (it is). <b>Your</b> и <b>you’re</b> (you are).</p>",

mkA(5,5,"Юмор и каламбуры","pun, dry humour, understatement, wordplay",
"<p>Английский юмор часто строится на игре слов.</p><p><b>Pun (каламбур)</b>: «I used to be a banker, but I lost interest.» (interest: интерес и проценты). <b>Dry humour</b>: сухой юмор без улыбки: «I’m not saying he’s slow, but he’s early for yesterday.» <b>Self-deprecating humour</b>: шутки над собой. <b>Double entendre</b>: двойной смысл.</p><p>Британский юмор любит understatement и irony: «Not bad» может значить «великолепно».</p>",

mkA(5,6,"Перевод и редактирование","ложные друзья, идиомы, сокращение и вычитка",
"<p>Перевод — это передача смысла, а не слов. <b>Ложные друзья</b>: <b>accurate</b> (точный, а не «аккуратный»), <b>intelligent</b> (умный, а не «интеллигентный»), <b>fabric</b> (ткань), <b>resume</b> (возобновить; <b>résumé</b> — резюме). Идиомы переводят по смыслу: It’s raining cats and dogs — льёт как из ведра.</p><p>Редактирование: сократите лишнее (<b>due to the fact that</b> → <b>because</b>), уберите повторы, замените пассив активом, проверьте согласование времён и пунктуацию. Читайте текст вслух.</p>",
"accurate:точный,intelligent:умный,fabric:ткань,resume:возобновлять,literal:буквальный,proofread:вычитывать,concise:краткий,redundant:избыточный",

"<p>Для спонтанной речи и дебатов нужны готовые «опоры».</p><p><b>Выиграть время</b>: <b>Well, let me think…</b> <b>That’s a fair point, but…</b> <b>What I mean is…</b> <b>To put it differently…</b></p><p><b>Согласие и несогласие</b>: <b>I couldn’t agree more.</b> <b>I see your point, however…</b> <b>I’m afraid I have to disagree.</b> <b>That’s not necessarily true.</b></p><p><b>Вежливо перебить</b>: <b>Sorry to interrupt, but…</b> <b>If I could just add…</b> Лучше короткая опора (well, you know), чем долгое молчание.</p>",
